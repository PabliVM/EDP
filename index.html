<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coordinación EDP</title>
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/porteros.css" />
</head>
<body>
  <div id="app">
    <header id="rm-header"></header>
    <div id="rm-team-bar-container"></div>
    <main id="rm-main">
      <div id="view-inicio"></div>
      <div id="view-semana" class="hidden"></div>
    </main>
    <footer id="rm-footer"></footer>
  </div>

  <!-- PANEL LATERAL CONFIGURACIÓN -->
  <div id="config-panel-overlay" class="config-overlay hidden">
    <div id="config-panel" class="config-panel"></div>
  </div>

  <!-- MODAL EDITOR DÍA -->
  <div id="porteros-overlay" class="overlay hidden">
    <div id="porteros-modal" class="modal"></div>
  </div>

  <!-- TOAST -->
  <div id="rm-toast" class="toast hidden" role="alert"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
